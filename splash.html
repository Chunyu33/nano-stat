<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoStat</title>
    <script>
      // 在 CSS 应用前读取主题（避免闪白）
      // 优先级：localStorage 设置（nanostat-theme: dark/light/system）> 系统偏好
      (function () {
        try {
          var stored = localStorage.getItem('nanostat-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* 深色主题渐变（翠绿科技风） */
      [data-theme='dark'] {
        --grad-1: #0b1220;
        --grad-2: #0f2a24;
        --grad-3: #064e3b;
        --logo-color: #34d399;
        --text-color: #e2e8f0;
        --text-muted: #64748b;
        --bar-color: rgba(52, 211, 153, 0.7);
      }

      /* 浅色主题渐变 */
      [data-theme='light'] {
        --grad-1: #f0fdf4;
        --grad-2: #d1fae5;
        --grad-3: #a7f3d0;
        --logo-color: #059669;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --bar-color: rgba(5, 150, 105, 0.6);
      }

      body {
        background: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
        background-size: 300% 300%;
        animation: gradient-flow 6s ease-in-out infinite;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        user-select: none;
      }

      @keyframes gradient-flow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Logo 区域 */
      .logo-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
        color: var(--logo-color);
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid var(--logo-color);
        box-shadow: 0 0 24px var(--logo-color);
        animation: logo-pulse 2s ease-in-out infinite;
      }

      @keyframes logo-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 18px var(--logo-color);
        }
        50% {
          transform: scale(1.06);
          box-shadow: 0 0 34px var(--logo-color);
        }
      }

      .logo-text {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--text-color);
      }

      .logo-text small {
        display: block;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 3px;
        color: var(--text-muted);
        margin-top: 6px;
      }

      /* 加载进度条 */
      .loading-bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgba(128, 128, 128, 0.2);
        overflow: hidden;
      }

      .loading-bar-inner {
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: var(--bar-color);
        animation: bar-slide 1.2s ease-in-out infinite;
      }

      @keyframes bar-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      .loading-text {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="logo-wrap">
      <div class="logo-icon"></div>
      <div class="logo-text">
        NanoStat
        <small>硬件监控</small>
      </div>
    </div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
    <div class="loading-text">正在启动…</div>
  </body>
</html>
